<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <meta name="theme-color" content="#ffffff">
  <title>Adnova Code</title>
  <link rel="stylesheet" href="/css/app.css">
</head>

<body>

<div class="shell">

  <aside class="sidebar">

    <div class="brand">
      <div class="brand-mark">A</div>
      <div>
        <strong>Adnova</strong>
        <span>Code</span>
      </div>
    </div>

    <button class="profile-card" id="profile-button">
      <div class="profile-avatar">H</div>
      <div class="profile-info">
        <strong id="profile-name">Your Profile</strong>
        <span>@you</span>
      </div>
      <span class="profile-chevron">›</span>
    </button>

    <button class="new-repository-button" id="create-repository-button">
      <span>＋</span>
      New repository
    </button>

    <nav class="main-nav">

      <button class="nav-item active" data-page="overview">
        <span>⌂</span>
        Overview
      </button>

      <button class="nav-item" data-page="repositories">
        <span>◫</span>
        Repositories
      </button>

      <button class="nav-item" data-page="codespaces">
        <span>▣</span>
        Codespaces
      </button>

      <button class="nav-item" data-page="branches">
        <span>⑂</span>
        Branches
      </button>

    </nav>

    <div class="sidebar-section-title">
      YOUR WORK
    </div>

    <div id="repository-list" class="repository-list">
      <div class="empty-list">
        No repositories yet.
      </div>
    </div>

    <div class="sidebar-bottom">

      <button class="nav-item" data-page="settings">
        <span>⚙</span>
        Settings
      </button>

      <button class="nav-item" data-page="plugins">
        <span>◇</span>
        Plugins
      </button>

    </div>

  </aside>

  <main class="content">

    <header class="topbar">

      <div class="topbar-left">
        <button id="mobile-menu-button" class="icon-button">☰</button>
        <div id="page-breadcrumb">Overview</div>
      </div>

      <div class="topbar-right">
        <span id="connection-indicator" class="connection-indicator">
          ● Connected
        </span>

        <button id="top-profile-button" class="top-profile">
          <span class="profile-avatar small">H</span>
        </button>
      </div>

    </header>

    <div id="page-root" class="page-root"></div>

  </main>

</div>


<div id="repository-modal" class="modal hidden">

  <div class="modal-card">

    <div class="modal-header">
      <div>
        <div class="modal-eyebrow">NEW REPOSITORY</div>
        <h2>Create repository</h2>
      </div>

      <button id="close-repository-modal" class="close-button">
        ×
      </button>
    </div>

    <label>
      Repository name
      <input
        id="repository-name-input"
        type="text"
        placeholder="my-project"
        autocomplete="off"
      >
    </label>

    <label>
      Description
      <input
        id="repository-description-input"
        type="text"
        placeholder="What is this project?"
      >
    </label>

    <label class="checkbox-label">
      <input id="repository-readme-input" type="checkbox" checked>
      <span>Add a README file</span>
    </label>

    <label>
      Visibility
      <select id="repository-visibility-input">
        <option value="public">Public</option>
        <option value="private">Private</option>
      </select>
    </label>

    <div class="modal-note">
      Public repositories can be viewed by other users.
      Private repositories stay visible only to people with access.
    </div>

    <button id="confirm-repository-button" class="primary-button">
      Create repository
    </button>

  </div>

</div>


<div id="toast" class="toast hidden"></div>

<script src="/js/app.js"></script>

</body>
</html>
