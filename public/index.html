<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Adnova Code</title>
  <link rel="stylesheet" href="/css/app.css">
</head>

<body>

<div class="app-shell">

  <aside class="sidebar">

    <div class="brand">
      <div class="brand-icon">A</div>
      <div>
        <strong>Adnova</strong>
        <span>Code</span>
      </div>
    </div>

    <button class="profile-button" id="profile-button">
      <div class="avatar">H</div>

      <div class="profile-copy">
        <strong>Your Profile</strong>
        <span>@you</span>
      </div>

      <span class="chevron">›</span>
    </button>

    <button
      id="create-repository-button"
      class="create-button"
    >
      <span>＋</span>
      <span>New repository</span>
    </button>

    <nav class="sidebar-nav">

      <button class="nav-link active" data-page="home">
        <span>⌂</span>
        <span>Home</span>
      </button>

      <button class="nav-link" data-page="repositories">
        <span>▣</span>
        <span>Repositories</span>
      </button>

      <button class="nav-link" data-page="codespaces">
        <span>▤</span>
        <span>Codespaces</span>
      </button>

      <button class="nav-link" data-page="branches">
        <span>⑂</span>
        <span>Branches</span>
      </button>

    </nav>

    <div class="sidebar-label">
      YOUR REPOSITORIES
    </div>

    <div
      id="repository-list"
      class="repository-list"
    ></div>

    <div class="sidebar-spacer"></div>

    <button class="nav-link" data-page="settings">
      <span>⚙</span>
      <span>Settings</span>
    </button>

    <button class="nav-link" data-page="plugins">
      <span>◇</span>
      <span>Plugins</span>
    </button>

  </aside>


  <main class="main-area">

    <header class="topbar">

      <div class="topbar-left">

        <button
          id="mobile-menu-button"
          class="mobile-menu-button"
        >
          ☰
        </button>

        <div id="breadcrumb">
          Home
        </div>

      </div>

      <div class="topbar-right">

        <div class="connection">
          <span></span>
          Adnova Code
        </div>

        <button
          id="top-profile-button"
          class="top-avatar"
        >
          H
        </button>

      </div>

    </header>


    <section id="page-root" class="page-root"></section>

  </main>

</div>


<div
  id="repository-modal"
  class="modal hidden"
>

  <div class="modal-card">

    <div class="modal-header">

      <div>
        <div class="modal-label">
          NEW REPOSITORY
        </div>

        <h2>
          Create repository
        </h2>
      </div>

      <button
        id="close-modal"
        class="close-modal"
      >
        ×
      </button>

    </div>

    <label class="field">
      <span>Repository name</span>

      <input
        id="repository-name"
        autocomplete="off"
        placeholder="my-project"
      >
    </label>

    <label class="field">
      <span>Description</span>

      <input
        id="repository-description"
        autocomplete="off"
        placeholder="What are you building?"
      >
    </label>

    <label class="check-field">
      <input
        id="repository-readme"
        type="checkbox"
        checked
      >
      <span>Add a README</span>
    </label>

    <label class="field">
      <span>Visibility</span>

      <select id="repository-visibility">
        <option value="public">
          Public
        </option>

        <option value="private">
          Private
        </option>
      </select>
    </label>

    <div class="modal-info">
      Public repositories can be viewed by others.
      Private repositories stay private.
    </div>

    <button
      id="create-repository-confirm"
      class="modal-primary"
    >
      Create repository
    </button>

  </div>

</div>


<div
  id="toast"
  class="toast hidden"
></div>


<script src="/js/app.js"></script>

</body>
</html>
