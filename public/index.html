<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffffff">
  <title>Adnova Code</title>
  <link rel="stylesheet" href="/css/app.css">
</head>

<body>

<div id="app-shell" class="app-shell">

  <aside class="sidebar">

    <div class="sidebar-brand">
      <div class="brand-icon">A</div>

      <div class="brand-text">
        <strong>Adnova</strong>
        <span>Code</span>
      </div>
    </div>

    <button class="profile-button" id="profile-button">
      <div class="avatar">H</div>

      <div class="profile-copy">
        <strong id="profile-name">Your Profile</strong>
        <span id="profile-handle">@you</span>
      </div>

      <span class="chevron">›</span>
    </button>

    <button
      class="create-button"
      id="create-repository-button"
    >
      <span>＋</span>
      <span>New repository</span>
    </button>

    <nav class="sidebar-nav">

      <button
        class="nav-link active"
        data-page="home"
      >
        <span class="nav-icon">⌂</span>
        <span>Home</span>
      </button>

      <button
        class="nav-link"
        data-page="repositories"
      >
        <span class="nav-icon">▣</span>
        <span>Repositories</span>
      </button>

      <button
        class="nav-link"
        data-page="codespaces"
      >
        <span class="nav-icon">▤</span>
        <span>Codespaces</span>
      </button>

      <button
        class="nav-link"
        data-page="branches"
      >
        <span class="nav-icon">⑂</span>
        <span>Branches</span>
      </button>

    </nav>

    <div class="sidebar-label">
      YOUR REPOSITORIES
    </div>

    <div
      id="sidebar-repositories"
      class="sidebar-repositories"
    ></div>

    <div class="sidebar-spacer"></div>

    <button
      class="nav-link"
      data-page="settings"
    >
      <span class="nav-icon">⚙</span>
      <span>Settings</span>
    </button>

    <button
      class="nav-link"
      data-page="plugins"
    >
      <span class="nav-icon">◇</span>
      <span>Plugins</span>
    </button>

  </aside>


  <main class="main-area">

    <header class="topbar">

      <div class="topbar-left">

        <button
          class="mobile-menu-button"
          id="mobile-menu-button"
        >
          ☰
        </button>

        <div
          id="breadcrumb"
          class="breadcrumb"
        >
          Home
        </div>

      </div>

      <div class="topbar-right">

        <div class="connection-status">
          <span class="status-dot"></span>
          Connected
        </div>

        <button
          class="top-avatar"
          id="top-avatar-button"
        >
          H
        </button>

      </div>

    </header>


    <main
      id="page-root"
      class="page-root"
    ></main>

  </main>

</div>


<!-- REPOSITORY MODAL -->

<div
  id="repository-modal"
  class="modal hidden"
>

  <div class="modal-card">

    <div class="modal-header">

      <div>
        <div class="modal-label">
          NEW REPOSITORY
        </div>

        <h2>Create repository</h2>
      </div>

      <button
        id="close-modal"
        class="close-modal"
      >
        ×
      </button>

    </div>


    <label class="form-field">

      <span>Repository name</span>

      <input
        id="repository-name"
        placeholder="my-project"
        autocomplete="off"
      >

    </label>


    <label class="form-field">

      <span>Description</span>

      <input
        id="repository-description"
        placeholder="What are you building?"
        autocomplete="off"
      >

    </label>


    <label class="checkbox-field">

      <input
        id="repository-readme"
        type="checkbox"
        checked
      >

      <span>
        Add a README
      </span>

    </label>


    <label class="form-field">

      <span>Visibility</span>

      <select id="repository-visibility">

        <option value="public">
          Public
        </option>

        <option value="private">
          Private
        </option>

      </select>

    </label>


    <div class="visibility-info">
      Public repositories can be viewed by anyone.
      Private repositories remain private.
    </div>


    <button
      id="create-repository-confirm"
      class="modal-primary-button"
    >
      Create repository
    </button>

  </div>

</div>


<div
  id="toast"
  class="toast hidden"
></div>


<script src="/js/app.js"></script>

</body>
</html>
